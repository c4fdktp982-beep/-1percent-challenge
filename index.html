<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b12">
<title>1% Challenge</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 0%, #29204d 0%, #11111b 45%, #08080d 100%);
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "Segoe UI", sans-serif;
}

.app {
  width: 100%;
  max-width: 460px;
  min-height: 100vh;
  margin: auto;
  padding: 24px 18px 35px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 2px;
}

.day {
  font-size: 12px;
  color: #aaaabd;
  letter-spacing: 1px;
}

.badge {
  display: inline-block;
  margin-top: 25px;
  padding: 10px 15px;
  border-radius: 999px;
  background: #292938;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1.5px;
}

.card {
  margin-top: 20px;
  padding: 25px 20px 22px;
  border-radius: 28px;
  background: rgba(28,28,39,.92);
  border: 1px solid rgba(255,255,255,.09);
  box-shadow: 0 20px 70px rgba(0,0,0,.45);
}

h1 {
  margin: 0;
  font-size: 34px;
  line-height: 1.05;
  letter-spacing: -1.5px;
}

.subtitle {
  margin: 14px 0 25px;
  color: #a7a7b8;
  font-size: 17px;
  line-height: 1.5;
}

.target-label {
  text-align: center;
  color: #9b9bab;
  font-size: 12px;
  letter-spacing: 3px;
  font-weight: 700;
}

.target {
  text-align: center;
  margin-top: 8px;
}

.timer {
  font-size: 76px;
  line-height: 1;
  font-weight: 950;
  letter-spacing: -4px;
  font-variant-numeric: tabular-nums;
}

.unit {
  text-align: center;
  color: #aaaaba;
  font-size: 20px;
  margin-top: 5px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 22px;
  padding: 20px;
  margin-top: 25px;
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
}

#startBtn {
  background: white;
  color: #101016;
}

#startBtn.running {
  background: #ff4964;
  color: white;
}

.progress {
  height: 7px;
  margin-top: 18px;
  background: #30303d;
  border-radius: 20px;
  overflow: hidden;
}

.progressBar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#7657ff,#bd72ff);
  border-radius: 20px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 15px;
}

.action {
  margin-top: 0;
  padding: 18px 10px;
  background: #292936;
  color: white;
  font-size: 16px;
}

.action.friend {
  background: linear-gradient(135deg,#704cff,#a467ff);
}

.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px;
  margin-top: 18px;
}

.stat {
  background: #1c1c27;
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 20px;
  padding: 18px 5px;
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 28px;
  font-variant-numeric: tabular-nums;
}

.stat span {
  display: block;
  margin-top: 7px;
  color: #9696a6;
  font-size: 11px;
  letter-spacing: 1px;
}

.streak {
  margin-top: 16px;
  padding: 18px;
  border-radius: 22px;
  background: #1c1c27;
  border: 1px solid rgba(255,255,255,.06);
}

.streak strong {
  font-size: 17px;
}

.streak small {
  display: block;
  margin-top: 5px;
  color: #9696a6;
  font-size: 13px;
}

.result {
  text-align: center;
  min-height: 26px;
  margin-top: 18px;
  font-weight: 800;
}

.win {
  color: #72f5ae;
}

.close {
  color: #ff7186;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="logo">1% CHALLENGE</div>
    <div class="day">SFIDA DI OGGI</div>
  </div>

  <div class="badge">⚡ SFIDA DI OGGI</div>

  <div class="card">

    <h1>Ferma il tempo.<br>Il più vicino vince.</h1>

    <div class="subtitle">
      Tocca <b>START</b> e prova a fermare il timer
      il più vicino possibile a <b>1,00 secondo.</b>
    </div>

    <div class="target-label">OBIETTIVO</div>

    <div class="target">
      <div class="timer" id="timer">0.00</div>
      <div class="unit">secondi</div>
    </div>

    <button id="startBtn">START</button>

    <div class="progress">
      <div class="progressBar" id="progressBar"></div>
    </div>

    <div class="actions">
      <button class="action">🎯 ALLENATI</button>
      <button class="action friend" id="friendBtn">👥 SFIDA UN AMICO</button>
    </div>

    <div class="result" id="result"></div>

  </div>

  <div class="stats">

    <div class="stat">
      <strong id="record">0.00</strong>
      <span>RECORD</span>
    </div>

    <div class="stat">
      <strong id="streak">1</strong>
      <span>STREAK 🔥</span>
    </div>

    <div class="stat">
      <strong id="coins">100</strong>
      <span>MONETE</span>
    </div>

  </div>

  <div class="streak">
    <strong>🔥 Torna domani</strong>
    <small>La tua streak può crescere.</small>
  </div>

</div>

<script>

let running = false;
let startTime = 0;
let animationFrame = null;

const timer = document.getElementById("timer");
const startBtn = document.getElementById("startBtn");
const progressBar = document.getElementById("progressBar");
const result = document.getElementById("result");
const recordEl = document.getElementById("record");
const coinsEl = document.getElementById("coins");
const friendBtn = document.getElementById("friendBtn");

let record = Number(localStorage.getItem("record")) || 0;
let coins = Number(localStorage.getItem("coins")) || 100;

recordEl.textContent = record.toFixed(2);
coinsEl.textContent = coins;

function updateTimer() {

  if (!running) return;

  const elapsed = (performance.now() - startTime) / 1000;

  timer.textContent = elapsed.toFixed(2);

  const progress = Math.min(elapsed / 1, 1) * 100;
  progressBar.style.width = progress + "%";

  animationFrame = requestAnimationFrame(updateTimer);
}

function startTimer() {

  running = true;

  startTime = performance.now();

  timer.textContent = "0.00";

  result.textContent = "";

  startBtn.textContent = "STOP";
  startBtn.classList.add("running");

  progressBar.style.width = "0%";

  cancelAnimationFrame(animationFrame);

  animationFrame = requestAnimationFrame(updateTimer);
}

function stopTimer() {

  if (!running) return;

  running = false;

  cancelAnimationFrame(animationFrame);

  const finalTime = (performance.now() - startTime) / 1000;

  timer.textContent = finalTime.toFixed(2);

  const difference = Math.abs(finalTime - 1);

  if (record === 0 || difference < Math.abs(record - 1)) {

    record = finalTime;

    localStorage.setItem("record", record);

    recordEl.textContent = record.toFixed(2);

  }

  const reward = Math.max(
    5,
    Math.round(30 - difference * 30)
  );

  coins += reward;

  localStorage.setItem("coins", coins);

  coinsEl.textContent = coins;

  if (difference <= 0.03) {

    result.textContent =
      "🔥 INCREDIBILE! Sei vicinissimo!";
    result.className = "result win";

  } else if (difference <= 0.10) {

    result.textContent =
      "⚡ Quasi perfetto! Riprova.";

    result.className = "result win";

  } else {

    result.textContent =
      "💪 Ci sei quasi. Riprova!";

    result.className = "result close";
  }

  startBtn.textContent = "RIPROVA";
  startBtn.classList.remove("running");
}

startBtn.addEventListener("click", function() {

  if (running) {
    stopTimer();
  } else {
    startTimer();
  }

});

friendBtn.addEventListener("click", async function() {

  const text =
    "🔥 Ho provato la 1% Challenge! " +
    "Riesci a fermare il timer a 1,00 secondo?";

  if (navigator.share) {

    try {

      await navigator.share({
        title: "1% Challenge",
        text: text,
        url: window.location.href
      });

    } catch (e) {}

  } else {

    alert(text);

  }

});

</script>

</body>
</html>
